name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt install -y libsdl2-dev libx11-dev libcurl4-openssl-dev nlohmann-json3-dev
      - name: Build
        run: cmake -B build && cmake --build build
      - name: Test
        run: cd build && ctest